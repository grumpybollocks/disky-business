name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            pyside: "PySide6>=6.5,<6.8"   # newer ones crash on Python 3.11 (seen here 2026-11-26)
          - python: "3.13"
            pyside: "PySide6>=6.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "numpy>=2.0" "${{ matrix.pyside }}"
      - run: sudo apt-get update && sudo apt-get install -y f3 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -X faulthandler -m unittest -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Window tests really ran
        run: python -c "import PySide6, diskygui.window; print(PySide6.__version__)"
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Engine output fits the contract
        run: |
          mkdir -p "$RUNNER_TEMP/drive"
          python -m disky test "$RUNNER_TEMP/drive" --size 16M --keep-free 0 --json | python tools/check_events.py -
