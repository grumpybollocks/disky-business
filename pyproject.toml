[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disky-business"
version = "0.1.0.dev0"
description = "Fill a drive, read it back, see every block."
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
gui = [
    "PySide6>=6.5; python_version >= '3.12'",
    "PySide6>=6.5,<6.8; python_version < '3.12'",   # newer ones crash on 3.11 (CI, 2026-11-26)
]
[project.scripts]
disky = "disky.cli:main"
[project.gui-scripts]
disky-business = "diskygui.__main__:main"

[tool.setuptools]
packages = ["disky", "diskygui"]
